<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive D3 slideshow about the multidimensional state of leading large language models in 2026.">
  <meta name="theme-color" content="#160d08">
  <title>No Single Finish Line — The LLM Landscape in 2026</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23160d08'/%3E%3Cpath d='M13 8h7v48h-7z' fill='%23ff7a1a'/%3E%3Ccircle cx='40' cy='32' r='12' fill='%23fff7ed'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#story">Skip to the visualization</a>

  <header class="site-header">
    <a class="brand" href="#overall" aria-label="Restart the story">
      <span class="brand-title">
        <span class="brand-mark" aria-hidden="true">●</span>
        <span>LLM LEADERBOARD STORY</span>
      </span>
      <span class="brand-theme">No LLM is universally best because the apparent leader changes with the benchmark, task, and price constraint.</span>
    </a>
  </header>

  <main id="story" class="story-shell">
    <nav class="story-nav" aria-label="Story chapters">
      <div class="progress-track" aria-hidden="true">
        <span id="progress-fill"></span>
      </div>
      <div id="chapter-nav" class="chapter-nav"></div>
    </nav>

    <section class="stage" aria-live="polite" aria-atomic="false">
      <div class="scene-copy">
        <p id="scene-kicker" class="scene-kicker"></p>
        <h1 id="scene-title"></h1>
        <p id="scene-deck" class="scene-deck"></p>
        <div id="scene-controls" class="scene-controls"></div>
      </div>

      <div class="visual-panel">
        <div class="chart-header">
          <div>
            <p id="chart-eyebrow" class="chart-eyebrow"></p>
            <h2 id="chart-title"></h2>
          </div>
          <div id="chart-legend" class="chart-legend" aria-label="Chart legend"></div>
        </div>
        <div id="chart" class="chart" role="group"></div>
        <p id="chart-caption" class="chart-caption"></p>
      </div>
    </section>

    <footer class="story-footer">
      <button id="prev-button" class="nav-button nav-button-secondary" type="button">
        <span aria-hidden="true">←</span> Previous
      </button>
      <p id="step-status" class="step-status" aria-live="polite"></p>
      <button id="next-button" class="nav-button nav-button-primary" type="button">
        Next <span aria-hidden="true">→</span>
      </button>
    </footer>
  </main>

  <footer class="source-footer">
    <p>Data: <a href="https://www.vellum.ai/llm-leaderboard" target="_blank" rel="noopener noreferrer">Vellum LLM Leaderboard</a>, updated July 1, 2026 · Built with D3.js</p>
    <p>Use <kbd>←</kbd> <kbd>→</kbd> to change slides.</p>
  </footer>

  <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>
  <noscript>This narrative requires JavaScript to render its D3 visualizations.</noscript>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
